apiVersion: apps/v1
kind: Deployment
metadata:
  name: yuyy-nginx
  labels:
    app: yuyy-nginx
spec:
  replicas: 3
  selector:
    matchLabels:
      app: yuyy-nginx
  template:
    metadata:
      labels:
        app: yuyy-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:1.14.2
          ports:
            - containerPort: 80

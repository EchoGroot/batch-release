# This rule is not used by the project batch-release-tmp itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to rollouts.yuyy.com resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: batch-release-tmp
    app.kubernetes.io/managed-by: kustomize
  name: batchrelease-viewer-role
rules:
- apiGroups:
  - rollouts.yuyy.com
  resources:
  - batchreleases
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - rollouts.yuyy.com
  resources:
  - batchreleases/status
  verbs:
  - get

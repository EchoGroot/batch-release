---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - rollouts.yuyy.com
  resources:
  - batchreleases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rollouts.yuyy.com
  resources:
  - batchreleases/finalizers
  verbs:
  - update
- apiGroups:
  - rollouts.yuyy.com
  resources:
  - batchreleases/status
  verbs:
  - get
  - patch
  - update
